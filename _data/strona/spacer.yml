nadtytul: Jesteś na spacerze nad Zakrzówkiem?
kroki:
  - tytul: Zejdź na chwilę ze ścieżki
    tekst: Kawiarnia jest tuż nad Zakrzówkiem, bez nadkładania drogi.
  - tytul: Weź kawę na wynos
    tekst: W naszym kubku z logo, do tego drożdżówka albo croissant z witryny.
  - tytul: …albo zostań na widoku
    tekst: Usiądź przy stoliku i popatrz na turkusową wodę i zieleń wokół zalewu.
przycisk_odleglosc: Ile mam do was?
notka_odleglosc: Sprawdzimy, jak daleko jesteś (lokalizacja nie jest nigdzie zapisywana).
