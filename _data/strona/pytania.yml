nadtytul: Pytania
tytul: Najczęstsze pytania o Café Zakrzówek
lista:
  - pytanie: Gdzie dokładnie jest kawiarnia Café Zakrzówek?
    odpowiedz: Przy ul. Wyłom 22 w Krakowie (Dębniki), tuż nad zalewem Zakrzówek. Przycisk „Prowadź do nas” wyznaczy trasę pieszą w Mapach Google.
  - pytanie: W jakich godzinach jesteście otwarci?
    odpowiedz: Codziennie od 9:00 do 19:00.
  - pytanie: Czy mogę wziąć kawę na wynos na spacer?
    odpowiedz: Tak. Kawę podajemy na wynos w naszych kubkach, a do tego możesz wziąć coś z witryny.
  - pytanie: Co można u was zjeść?
    odpowiedz: "Codziennie w witrynie są croissanty wytrawne i kanapki, a do tego drożdżówki: malinianki, a sezonowo jagodzianki i poziomianki. Witryna zmienia się codziennie, a niektóre pozycje chętnie podgrzejemy."
  - pytanie: Czy można u was zorganizować przyjęcie albo spotkanie firmowe?
    odpowiedz: "Tak. W dużej sali z widokiem na zieleń wokół zalewu organizujemy urodziny i imieniny, imprezy firmowe, spotkania biznesowe, konferencje i warsztaty, baby shower oraz ceremonie zaślubin. Termin ustalisz pod numerem [795 455 233](tel:+48795455233) lub mailowo: [cafe.zakrzowek@gmail.com](mailto:cafe.zakrzowek@gmail.com)."
  - pytanie: Czy w kawiarni są gry planszowe?
    odpowiedz: Tak, na miejscu są szachy i gry planszowe, a do kawy gazety i magazyny.
