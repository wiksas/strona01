nadtytul: Zaplanuj swoje wydarzenie u nas
tytul: Sala na przyjęcia w Krakowie z widokiem na Zakrzówek
wstep: "Duża sala ze światełkami i oknami na zieleń wokół zalewu, w kawiarni przy ul. Wyłom 22. Organizujemy:"
rodzaje:
  - urodziny i imieniny
  - imprezy firmowe
  - spotkania biznesowe
  - konferencje i warsztaty
  - baby shower
  - ceremonie zaślubin
tekst_dodatkowy: Organizujemy też spotkania z gośćmi, np. wieczory podróżnicze. Śledź nasz Instagram, żeby nie przegapić kolejnego.
przycisk_mail: Napisz w sprawie sali
